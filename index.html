<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Music Visualizer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        
        h2 { text-align: center; color: #fff; margin-bottom: 20px; text-shadow: 0 0 10px #ff0055; }
        .section { background: #161616; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
        .section-title { font-size: 16px; font-weight: bold; color: #ccc; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        
        input[type="file"], select { width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 5px; margin-bottom: 10px; font-size: 14px;}
        input[type="range"] { width: 100%; accent-color: #ff0055; }
        input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; background: transparent; }
        
        canvas { width: 100%; border-radius: 10px; background: #000; box-shadow: 0 4px 20px rgba(255,0,85,0.2); margin-top: 10px; }
        
        .btn-container { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        button { flex: 1; padding: 12px; background: #ff0055; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button.secondary { background: #222; border: 1px solid #555; }
        button.loop-btn.active { background: #4CAF50; }
        button:disabled { background: #444; cursor: not-allowed; }
        
        .download-btn { display: block; text-align: center; margin-top: 10px; color: #4CAF50; font-weight: bold; text-decoration: none; font-size: 14px;}
        .note { font-size: 11px; color: #777; margin-top: 10px; text-align: center; }
        .status-msg { text-align: center; color: #FFD700; font-weight: bold; margin-top: 10px; display: none;}
        video { width: 100%; border-radius: 10px; margin-top: 10px; display: none; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎧 Neon Music Visualizer</h2>

        <div class="section">
            <div class="section-title">1. Tải lên Nhạc & Ảnh Nền</div>
            <input type="file" id="audioFile" accept="audio/*,video/mp4">
            <label>Ảnh nền (Ảnh ca sĩ/Album - Tùy chọn):</label>
            <input type="file" id="bgImage" accept="image/*">
            
            <div class="btn-container">
                <button id="playBtn" class="secondary" disabled>▶️ Phát</button>
                <button id="pauseBtn" class="secondary" disabled>⏸️ Tạm dừng</button>
                <button id="loopBtn" class="secondary loop-btn" disabled>🔁 Lặp lại</button>
                <button id="renderBtn" disabled>⬇️ Xuất Video</button>
            </div>
            <div class="btn-container">
                <button id="stopBtn" class="secondary" style="display:none;">⏹️ Dừng ghi & Lưu</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">2. Tùy chỉnh Sóng (Phong cách Pro)</div>
            <div class="control-group">
                <label>Kiểu dáng sóng:</label>
                <select id="barStyle">
                    <option value="bar">Cột mảnh (Clean Bar)</option>
                    <option value="line">Sóng mượt (Wave)</option>
                    <option value="dots">Chấm tròn (Dots)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Độ cao sóng: <span id="heightVal">1.5</span></label>
                <input type="range" id="barHeight" min="0.5" max="3" step="0.1" value="1.5" oninput="document.getElementById('heightVal').textContent = this.value;">
            </div>
            <div class="control-group">
                <label>Độ dày thanh: <span id="thickVal">2</span></label>
                <input type="range" id="barWidth" min="1" max="10" value="2" oninput="document.getElementById('thickVal').textContent = this.value;">
            </div>
            <div class="control-group">
                <label>Độ nhạy (Chống bị bão hòa): <span id="sensVal">1.0</span></label>
                <input type="range" id="sensitivity" min="0.1" max="3" step="0.1" value="1.0" oninput="document.getElementById('sensVal').textContent = this.value;">
            </div>
            <div class="control-group">
                <label>Độ phát sáng (Glow): <span id="glowVal">15</span></label>
                <input type="range" id="glow" min="0" max="30" value="15" oninput="document.getElementById('glowVal').textContent = this.value;">
            </div>
            <div class="control-group">
                <label>Hiệu ứng Gương (Reflection):</label>
                <select id="mirror">
                    <option value="on">Bật (Có bóng phản chiếu)</option>
                    <option value="off">Tắt</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">3. Màu Sắc</div>
            <div class="control-group">
                <label>Chọn màu Gradient (Sóng sẽ đổi màu theo nhạc):</label>
                <div style="display: flex; gap: 10px;">
                    <div><label>Màu 1:</label><input type="color" id="color1" value="#ff0055"></div>
                    <div><label>Màu 2:</label><input type="color" id="color2" value="#ffaa00"></div>
                    <div><label>Màu nền (nếu không có ảnh):</label><input type="color" id="bgColor" value="#000000"></div>
                </div>
            </div>
        </div>

        <canvas id="previewCanvas"></canvas>

        <div class="status-msg" id="statusMsg">🟢 Đang ghi hình... Bấm "Dừng ghi" để xem!</div>
        <video id="outputVideo" controls style="display:none;"></video>
        <a id="downloadLink" class="download-btn" style="display:none;">⬇️ Tải Video Về Máy</a>
        <p class="note">Bản Pro: Hỗ trợ Ảnh nền, Gương, Chấm Peak. Tự động chọn MP4 cho iOS, WebM cho Android.</p>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('audioFile');
        const bgImageInput = document.getElementById('bgImage');
        const renderBtn = document.getElementById('renderBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusMsg = document.getElementById('statusMsg');
        const outputVideo = document.getElementById('outputVideo');
        const downloadLink = document.getElementById('downloadLink');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const loopBtn = document.getElementById('loopBtn');

        canvas.width = 640;
        canvas.height = 480;

        let audioCtx, source, analyser;
        let mediaRecorder;
        let recordedChunks = [];
        let animationId;
        let audioEl;
        let isRecording = false;
        let backgroundImage = null;

        // Xử lý ảnh nền
        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { backgroundImage = img; };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Xử lý audio
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (audioCtx) { audioCtx.close(); }

            const audioUrl = URL.createObjectURL(file);
            audioEl = new Audio(audioUrl);
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audioEl);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.85; 
            source.connect(analyser);
            source.connect(audioCtx.destination);

            // Thiết lập ghi hình (Codec tự động cho iOS/Android)
            const canvasStream = canvas.captureStream(30);
            const audioDest = audioCtx.createMediaStreamDestination();
            source.connect(audioDest);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioDest.stream.getAudioTracks()
            ]);

            let mimeType = 'video/webm;codecs=vp8';
            if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
                mimeType = 'video/mp4;codecs=avc1';
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
                mimeType = 'video/webm;codecs=vp9';
            }

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType });
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                
                outputVideo.src = url;
                outputVideo.style.display = 'block';
                downloadLink.href = url;
                downloadLink.download = 'visualizer.' + (mimeType.includes('mp4') ? 'mp4' : 'webm');
                downloadLink.style.display = 'block';
                
                renderBtn.disabled = false;
                stopBtn.style.display = 'none';
                statusMsg.style.display = 'none';
                isRecording = false;
                cancelAnimationFrame(animationId);
            };

            playBtn.disabled = false;
            pauseBtn.disabled = false;
            loopBtn.disabled = false;
            renderBtn.disabled = false;

            draw();
        });

        playBtn.addEventListener('click', async () => {
            await audioCtx.resume();
            audioEl.play();
        });

        pauseBtn.addEventListener('click', () => audioEl.pause());

        loopBtn.addEventListener('click', () => {
            audioEl.loop = !audioEl.loop;
            loopBtn.classList.toggle('active', audioEl.loop);
        });

        renderBtn.addEventListener('click', async () => {
            if (!mediaRecorder) return;
            await audioCtx.resume();
            await audioEl.play();

            recordedChunks = [];
            mediaRecorder.start(1000); 
            isRecording = true;

            renderBtn.disabled = true;
            stopBtn.style.display = 'block';
            statusMsg.style.display = 'block';
        });

        stopBtn.addEventListener('click', () => {
            if (isRecording) stopRecording();
        });

        function stopRecording() {
            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            isRecording = false;
        }

        // Hàm vẽ Neon Clean
        function draw() {
            animationId = requestAnimationFrame(draw);
            const width = canvas.width;
            const height = canvas.height;

            // 1. Vẽ nền (Ảnh hoặc màu)
            ctx.fillStyle = document.getElementById('bgColor').value;
            ctx.fillRect(0, 0, width, height);
            
            if (backgroundImage) {
                // Vẽ ảnh phủ đầy màn hình (Cover)
                const imgRatio = backgroundImage.width / backgroundImage.height;
                const canvasRatio = width / height;
                let drawWidth, drawHeight, drawX, drawY;
                if (imgRatio > canvasRatio) {
                    drawHeight = height;
                    drawWidth = height * imgRatio;
                    drawX = (width - drawWidth) / 2;
                    drawY = 0;
                } else {
                    drawWidth = width;
                    drawHeight = width / imgRatio;
                    drawX = 0;
                    drawY = (height - drawHeight) / 2;
                }
                ctx.drawImage(backgroundImage, drawX, drawY, drawWidth, drawHeight);
                // Làm tối ảnh nền để sóng nổi bật
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                ctx.fillRect(0, 0, width, height);
            }

            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            
            const numBars = 60; // Số thanh
            const barW = parseInt(document.getElementById('barWidth').value);
            const barH = parseFloat(document.getElementById('barHeight').value);
            const sensitivity = parseFloat(document.getElementById('sensitivity').value);
            const glow = parseInt(document.getElementById('glow').value);
            const mirrorOn = document.getElementById('mirror').value === 'on';
            const style = document.getElementById('barStyle').value;

            const g1 = document.getElementById('color1').value;
            const g2 = document.getElementById('color2').value;

            ctx.shadowBlur = glow;
            ctx.shadowColor = g1;

            const totalSpacing = width / numBars;
            const actualWidth = Math.max(1, totalSpacing - 2);

            // Vẽ sóng
            for (let i = 0; i < numBars; i++) {
                const step = Math.floor(bufferLength / numBars);
                let value = Math.pow(dataArray[i * step] / 255, 1.2) * sensitivity;
                value = Math.min(value, 1.0);

                let barHeight = (value * height * 0.7) * barH;
                if (barHeight < 3) barHeight = 3;

                let x = i * totalSpacing + (totalSpacing - actualWidth) / 2;
                let y = height - barHeight - 20; // Cách đáy 20px

                const grad = ctx.createLinearGradient(0, y, 0, height);
                grad.addColorStop(0, g2);
                grad.addColorStop(1, g1);
                ctx.fillStyle = grad;

                // Vẽ chính
                if (style === 'bar') {
                    ctx.fillRect(x, y, actualWidth, barHeight);
                } else if (style === 'dots') {
                    ctx.beginPath();
                    ctx.arc(x + actualWidth/2, y + barHeight/2, actualWidth, 0, Math.PI * 2);
                    ctx.fill();
                } else if (style === 'line') {
                    ctx.beginPath();
                    ctx.arc(x + actualWidth/2, y + barHeight/2, actualWidth/2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Vẽ chấm tròn trên đỉnh (Peak)
                ctx.beginPath();
                ctx.arc(x + actualWidth/2, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.fillStyle = grad;

                // Vẽ Gương (Reflection)
                if (mirrorOn) {
                    ctx.save();
                    ctx.globalAlpha = 0.3; // Độ mờ gương
                    ctx.translate(0, 2 * (height - 20)); // Trục gương dưới đáy
                    ctx.scale(1, -1);
                    if (style === 'bar') ctx.fillRect(x, y, actualWidth, barHeight);
                    else if (style === 'dots') ctx.fillRect(x, y, actualWidth, barHeight);
                    else if (style === 'line') ctx.beginPath(), ctx.arc(x + actualWidth/2, y + barHeight/2, actualWidth/2, 0, Math.PI * 2), ctx.fill();
                    ctx.restore();
                }
            }

            // Vẽ đường kẻ dưới cùng (trục)
            ctx.fillStyle = "rgba(255,255,255,0.3)";
            ctx.fillRect(0, height - 20, width, 2);
        }
    </script>
</body>
</html>
